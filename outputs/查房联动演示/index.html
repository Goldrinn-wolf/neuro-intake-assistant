line-offset:3px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #e9eeed;padding:11px 0}.row:last-child{padding-bottom:1px}.rowlabel{font-weight:650;font-size:14px}.rowtext{color:#42565c;font-size:13px;line-height:1.65;margin-top:3px;overflow-wrap:anywhere}.row .editbtn,.gap{border-radius:6px}.editbtn{color:var(--green);border:1px solid #d1e2de;background:#f8fbfa;white-space:nowrap;font-size:12px;padding:5px 9px}.gap{display:flex;text-align:left;align-items:center;justify-content:space-between;width:100%;padding:9px 3px;border-top:1px solid #e8eceb;gap:8px;font-size:13px}.gap:hover{background:#f0f6f3}.gap small{color:#916722;white-space:nowrap}.hero{background:#e4f2eb;border-color:#badacc}.hero .eyebrow{color:#327363}.hero h2{margin:6px 0 8px}.oral{font-size:17px;line-height:1.85;color:#183d38;overflow-wrap:anywhere}.actions{gap:10px;flex-wrap:wrap;margin-top:13px}.group-title{margin:12px 0 6px;font-size:12px;color:var(--mut);font-weight:700}.lesson{margin:10px 0}.lesson h4{font-size:14px;margin-bottom:5px}.lesson p,.answer{font-size:14px;color:#455b60;line-height:1.8}.footnote{font-size:12px;color:#627574;line-height:1.7;margin:7px 0}.question{padding:12px 0;border-top:1px solid var(--line)}details>summary{cursor:pointer;color:#285e55;font-size:14px;line-height:1.6}.question summary{font-weight:600;color:#273d40}.qno{font:600 12px Consolas,monospace;color:#498079}.answer{margin-top:9px}.blockmore{margin-top:10px}.note{color:#7d602d;background:#fff7e8;border-radius:7px;padding:8px 10px;font-size:12px}.reset{margin-top:16px}.stamp{display:inline-flex;gap:6px;align-items:center;color:var(--mut);font-size:12px}.sr{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}.empty{color:var(--mut);font-size:13px}dialog{color:#263a40;border:1px solid #bbcfca;padding:0;border-radius:14px;width:min(475px,calc(100vw - 24px));max-height:85vh;box-shadow:0 20px 65px #162e382f}dialog::backdrop{background:#122f3873}dialog form{padding:24px}.dhead{margin-bottom:15px}.dhead h2{font-size:21px;margin-top:4px}.close{font-size:22px;color:#47615f}.control{display:block;width:100%;border:1px solid #b2c6c3;border-radius:7px;padding:9px;background:white;color:#203438;margin:5px 0 12px}.lab{font-size:13px;font-weight:650}.control:focus{outline:2px solid #359e8c;outline-offset:1px}textarea{resize:vertical;min-height:72px}.preset{font-size:12px;color:#186959;background:#edf6f2;border:1px solid #c5ddd3;border-radius:6px;padding:5px; margin-bottom:8px}.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.vgrid input{min-width:0}.err{color:#963d2d;font-size:13px;margin:6px 0}#toast{background:#173f39;color:white;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:24px;font-size:13px;pointer-events:none;opacity:0;z-index:5}#toast.on{opacity:1}button,summary{touch-action:manipulation}a{color:#077164}.hide{display:none!important}

<script>const DATA={"turning": {"title": "翻身后十余秒的旋转感", "history": "虚构教学病例。主诉：翻身时反复天旋地转2天。现病史：患者睡醒向右翻身、躺下或仰头取物后，隔几秒出现周围景物旋转，约10至20秒停止，伴轻度恶心。同一天发作多次，保持不动时无头晕，两次发作间可以正常行走。无耳鸣、听力变化、复视或言语不清。尚未做位置试验，未记录眼震。", "lessons": [{"id": "L1", "title": "头位改变后才开始晕", "explanation": "先问患者在翻身前是否舒服，再问单次发作多久。原来不晕，改变头位后短暂旋转，静止后恢复，提示触发性发作性前庭综合征。", "case_link": "本例反复发作已有两天，但每次旋转只持续10至20秒。", "evidence_ids": ["S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "L2", "title": "耳石为什么会让人翻身就晕", "explanation": "在常见的管石症中，脱落的耳石进入半规管。改变头位时颗粒随重力移动，带动内淋巴流动，引起短暂的旋转错觉和眼震。", "case_link": "向右翻身能诱发是问诊线索，尚不能据此指定患耳或半规管。", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "L3", "title": "用眼震给半规管定位", "explanation": "怀疑后半规管受累时做 Dix-Hallpike 试验。若诱发短暂眩晕，伴上跳和扭转性眼震，且眼球上极快相朝向下方耳，支持该侧后半规管耳石症。", "case_link": "病史明确写了尚未做位置试验，因此这里描述的是预期观察点。", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "L4", "title": "眼震与病史不相符时怎么办", "explanation": "首次一侧试验阴性，可查对侧。若病史吻合但试验只见水平眼震或未见眼震，可做仰卧滚转试验评估水平半规管。若另有神经体征，应重新评估病因。", "case_link": "患者自述间歇期能行走，仍需在查体时观察眼球运动、协调和步态。", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}], "questions": [{"id": "Q1", "priority": 1, "category": "基础", "question": "主任问“晕了多久”，该报两天还是十几秒？", "answer": "两者都报：这两天反复发作，每次头位改变后旋转10至20秒，间歇期无头晕。", "case_link": "这两个时间分别描述总病程和单次发作。", "pitfall": "", "evidence_ids": [], "evidence_quotes": [], "evidence_status": "病史解读"}, {"id": "Q2", "priority": 2, "category": "基础", "question": "哪一句追问最能区分头动诱发和头动加重？", "answer": "问“头没动的时候已经在晕吗？”从无症状开始一次短暂发作才叫诱发，已有眩晕变重叫加重。", "case_link": "本例保持不动时无头晕。", "pitfall": "", "evidence_ids": ["S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q4", "priority": 3, "category": "基础", "question": "向右翻身最晕，能直接写右后半规管受累吗？", "answer": "不能。诱发动作本身不能定位，要看哪一侧位置试验诱发了与相应半规管一致的眼震。", "case_link": "原文给出了翻身方向，没有眼震记录。", "pitfall": "", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q3", "priority": 4, "category": "基础", "question": "哪种病应优先考虑，目前能确诊吗？", "answer": "优先考虑良性阵发性位置性眩晕（BPPV，俗称耳石症）。还缺位置试验及相应眼震，暂不能确定分型和侧别。", "case_link": "躺下、翻身、仰头均可诱发。", "pitfall": "", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q5", "priority": 5, "category": "诊疗", "question": "怀疑后半规管耳石症，床旁先做什么？", "answer": "评估能否安全摆位后做 Dix-Hallpike 试验，记录哪侧诱发眩晕、眼震方向及持续时间。首侧阴性时检查对侧。", "case_link": "本例尚未做位置试验。", "pitfall": "", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q6", "priority": 6, "category": "基础", "question": "典型后半规管耳石症的眼震向哪儿跳？", "answer": "上跳伴扭转，眼球上极的快相朝向下方患耳。仅有头晕或仅写“眼震阳性”都不足以描述这一定位征。", "case_link": "这是要寻找的体征。", "pitfall": "", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q7", "priority": 7, "category": "诊疗", "question": "病史很像，但只诱出水平眼震，下一步呢？", "answer": "做仰卧滚转试验，比较两侧头位诱发的水平眼震，评估水平半规管受累。", "case_link": "这是位置试验后可能出现的分支。", "pitfall": "", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q8", "priority": 8, "category": "基础", "question": "什么发现会让你重新考虑中枢病因？", "answer": "新发复视、构音障碍、明显共济失调，或眼震模式与受刺激的半规管不符，都应扩大评估。", "case_link": "病史否认两项神经症状，仍缺正式查体。", "pitfall": "", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q9", "priority": 9, "category": "诊疗", "question": "若试验证实后半规管耳石症，首选什么处理？", "answer": "由受训者做相应侧的耳石复位，如 Epley 手法。选哪一侧复位取决于位置试验的定位结果。", "case_link": "本例还没有复位所需的定位资料。", "pitfall": "", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q10", "priority": 10, "category": "拓展", "question": "典型后半规管耳石症还需要常规拍头颅片吗？", "answer": "符合诊断标准且没有不相符的体征时，通常不需常规影像。若体征非典型或症状持续，应重新评估。", "case_link": "影像决策取决于检查结果。", "pitfall": "", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}], "sources": [{"id": "S1", "title": "AAO-HNSF 良性阵发性位置性眩晕指南更新", "year": "2017", "url": "https://doi.org/10.1177/0194599816689667", "retrieved": "2026-11-13", "level": "editorial"}, {"id": "S2", "title": "SAEM GRACE-3 急性头晕与眩晕指南", "year": "2023", "url": "https://www.saem.org/publications/grace/grace-3", "retrieved": "2026-11-13", "level": "editorial"}], "provenance": {"original_model": "deepseek-flash", "original_prompt": "1.2", "editor": "Codex", "clinician_reviewed": false, "study_revision": "开场汇报与优先提问"}, "short": "翻身后短暂眩晕", "caption": "头位改变后发作", "fields": [{"id": "course", "group": "问诊", "label": "总病程", "val": "近2天反复发作", "core": true}, {"id": "trigger", "group": "问诊", "label": "诱因与性质", "val": "向右翻身、躺下或仰头数秒后出现旋转感", "core": true}, {"id": "duration", "group": "问诊", "label": "单次持续与间歇", "val": "每次约10至20秒，静止时不晕，发作间自述行走正常", "core": true}, {"id": "assoc", "group": "问诊", "label": "伴随症状", "val": "伴轻度恶心，自述无耳鸣、听力变化、复视或言语不清", "core": true}, {"id": "posR", "group": "查体", "label": "右侧位置试验", "pending": "未做", "hint": "记录有无眩晕、眼震方向、潜伏期和持续时间", "options": []}, {"id": "posL", "group": "查体", "label": "左侧位置试验", "pending": "未做", "hint": "记录有无眩晕、眼震方向、潜伏期和持续时间", "options": []}, {"id": "nyst", "group": "查体", "label": "眼震观察", "pending": "未记录", "hint": "注明观察条件，再记录实际所见", "options": ["静坐正视时未见自发眼震"]}, {"id": "eyes", "group": "查体", "label": "眼球运动", "pending": "未记录", "hint": "记录方向和实际观察结果", "options": []}, {"id": "coord", "group": "查体", "label": "肢体协调", "pending": "未记录", "hint": "注明侧别、检查动作与结果", "options": []}, {"id": "gait", "group": "查体", "label": "站立与步态", "pending": "未记录", "hint": "区分床旁观察与患者自述", "options": []}]}, "continuous": {"title": "持续眩晕并需两人扶持站立", "history": "虚构教学病例。主诉：持续旋转感、呕吐及站立不稳30小时。现病史：昨日早餐时突然感觉屋子在转，之后静卧也一直晕，转头使原有眩晕加重。呕吐3次，需要两人扶持才能站立，无新发耳鸣，自觉听力无变化。未诉一侧肢体无力。既往有高血压。急诊头颅CT平扫报告未见出血。病历未描述自发眼震、听力床旁检查、眼球运动或MRI结果。", "lessons": [{"id": "L1", "title": "站不稳是这份病史里最急的线索", "explanation": "急起持续眩晕兼有严重姿势不稳时，要尽快按疑似后循环卒中评估。小脑或脑干缺血可以首先表现为眩晕和失衡，患者未诉偏瘫也不能降低处置的紧迫性。", "case_link": "本例需要两人扶持才能站立。先保证安全，立即报告上级并启动急诊评估。", "evidence_ids": ["S2", "S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "L2", "title": "动头加重与翻身诱发的区别", "explanation": "持续性前庭症状常对头动敏感。问患者静卧时是否也在晕，可以区分连续发作与每次变位才开始的数秒发作。呕吐本身对中枢和外周的区分有限。", "case_link": "患者静卧仍晕，已持续30小时，转头只是使原有眩晕加重。", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "L3", "title": "先确认 HINTS 能不能用", "explanation": "在仍有症状且有自发眼震的急性前庭综合征患者中，受训者可做头脉冲试验、观察眼震、做眼偏斜试验。若查体确无眼震，应重视坐站和步态稳定性。", "case_link": "本例未记录眼震，不能把“未描述”填成“无”，也不能补写 HINTS 结论。", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "L4", "title": "CT 报告回答了哪个问题", "explanation": "平扫未见出血不能排除后颅窝缺血。若床旁结果提示中枢、判读不确定，或临床仍高度怀疑卒中，应由卒中团队安排包括弥散加权成像在内的 MRI，并按需评估血管。", "case_link": "现有影像信息仅为头颅 CT 平扫未见出血，未提供 MRI 结果。", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}], "questions": [{"id": "Q1", "priority": 1, "category": "诊疗", "question": "查房时第一句该报告什么？", "answer": "突发持续眩晕30小时，站立需两人扶持。严重的新发姿势不稳提示后循环卒中风险，应立即报告上级并启动卒中评估。", "case_link": "站立困难是本例决定紧迫性的线索。", "pitfall": "", "evidence_ids": ["S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q8", "priority": 2, "category": "基础", "question": "头颅 CT 平扫未见出血，能排除小脑梗死吗？", "answer": "不能。急性后颅窝缺血在平扫上可能看不出来，不能用这一份报告解释严重站立不稳。", "case_link": "本例 CT 的结论仅涉及未见出血。", "pitfall": "", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q4", "priority": 3, "category": "基础", "question": "HINTS 适合在什么情况下做？", "answer": "由受过训练者用于仍有持续症状并有自发眼震的急性前庭综合征。先观察并记录眼震，本例现有文字还不能判定适用。", "case_link": "病历缺眼震结果。", "pitfall": "", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q2", "priority": 4, "category": "基础", "question": "转头更晕，为什么不直接考虑耳石症？", "answer": "患者不动时也一直晕，头动是加重因素。典型耳石症多是改变头位才诱发一次短暂眩晕。", "case_link": "症状在早餐时突然发生，此后未中断。", "pitfall": "", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q3", "priority": 5, "category": "基础", "question": "没说一侧手脚无力，还要考虑哪里有梗死？", "answer": "要考虑小脑或脑干。后循环梗死可突出表现为眩晕、协调障碍和站立不稳，未诉偏瘫不能排除。", "case_link": "患者仅未诉一侧肢体无力，病史没有完整神经查体。", "pitfall": "", "evidence_ids": ["S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q5", "priority": 6, "category": "基础", "question": "HINTS 哪三项表现提示中枢病因？", "answer": "在适用人群中，水平头脉冲试验正常、随凝视方向改变的眼震、交替遮眼时出现垂直眼位纠正，任一项都应警惕中枢病变。", "case_link": "这是条件性提问，三项均非本例已知所见。", "pitfall": "", "evidence_ids": ["S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q6", "priority": 7, "category": "诊疗", "question": "若确实没有眼震，应重点查什么？", "answer": "在有人保护下评估躯干、坐位和站立稳定性，并查肢体协调。已明显站不稳时，可记录所需扶持程度，无须让患者独自试走。", "case_link": "患者已经需要扶持站立。", "pitfall": "", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q7", "priority": 8, "category": "基础", "question": "患者自觉听力没变，床旁还可补什么？", "answer": "比较双耳听力，可用指擦声粗筛。新发单侧听力下降伴急性持续眩晕时，应警惕包括小脑前下动脉供血区缺血在内的病因。", "case_link": "主观听力无变化，未提供床旁听力检查。", "pitfall": "", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q9", "priority": 9, "category": "诊疗", "question": "HINTS 提示中枢或结果拿不准，怎么办？", "answer": "按疑似卒中及时评估，安排脑 MRI 含弥散加权成像，按需加做血管成像。不能取得可靠床旁结论时，也不能据此降低风险。", "case_link": "本例没有已完成的 HINTS 或 MRI 结果。", "pitfall": "", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q10", "priority": 10, "category": "拓展", "question": "即使早期弥散加权成像阴性，仍站不住怎么办？", "answer": "后循环小梗死早期可漏显。若临床持续高度可疑，应由卒中团队复评神经体征，并决定复查 MRI 或进一步血管检查。", "case_link": "这里讨论的是后续假设，原病史没有 MRI 结果。", "pitfall": "", "evidence_ids": ["S2"], "evidence_quotes": [], "evidence_status": "校订参考"}], "sources": [{"id": "S1", "title": "SAEM GRACE-3 急性头晕与眩晕指南", "year": "2023", "url": "https://www.saem.org/publications/grace/grace-3", "retrieved": "2026-11-13", "level": "editorial"}, {"id": "S2", "title": "Bárány 学会血管性眩晕诊断标准", "year": "2022", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9249306/", "retrieved": "2026-11-13", "level": "editorial"}], "provenance": {"original_model": "deepseek-flash", "original_prompt": "1.2", "editor": "Codex", "clinician_reviewed": false, "study_revision": "开场汇报与优先提问"}, "short": "持续眩晕伴站立困难", "caption": "静卧仍晕 · 站立需扶持", "fields": [{"id": "onset", "group": "问诊", "label": "起病与病程", "val": "昨日早餐时突发持续旋转感，已30小时", "core": true}, {"id": "trend", "group": "问诊", "label": "活动与症状", "val": "静卧仍晕，转头时加重", "core": true}, {"id": "severity", "group": "问诊", "label": "呕吐与站立", "val": "呕吐3次，病史记载需两人扶持才能站立", "core": true}, {"id": "assoc", "group": "问诊", "label": "伴随症状与既往史", "val": "无新发耳鸣，自觉听力无变化，未诉单侧肢体无力；既往有高血压", "core": true}, {"id": "ct", "group": "辅助检查", "label": "既有影像", "val": "急诊头颅CT平扫报告未见出血", "core": true}, {"id": "last", "group": "问诊", "label": "最后正常时间", "pending": "未记录", "hint": "记录日期或相对日期、时刻及信息来源", "options": []}, {"id": "evo", "group": "问诊", "label": "起病后症状演变", "pending": "待补问", "hint": "补充具体时点和变化", "options": []}, {"id": "nyst", "group": "查体", "label": "自发眼震", "pending": "未记录", "hint": "记录观察条件、方向与实际所见", "options": ["静坐正视时未见自发眼震"]}, {"id": "eyes", "group": "查体", "label": "眼球运动", "pending": "未记录", "hint": "注明方向与实际观察结果", "options": []}, {"id": "hear", "group": "查体", "label": "床旁听力", "pending": "未记录", "hint": "注明侧别、方法和实际所见", "options": []}, {"id": "coord", "group": "查体", "label": "肢体协调", "pending": "未记录", "hint": "注明侧别、检查动作与结果", "options": []}, {"id": "balance", "group": "查体", "label": "坐位与站立稳定性", "pending": "未记录", "hint": "仅记录已观察的姿势与所需扶持", "options": []}, {"id": "eval", "group": "辅助检查", "label": "卒中评估进展", "pending": "未记录", "hint": "记录已完成的评估与来源", "options": []}, {"id": "mri", "group": "辅助检查", "label": "后续影像结果", "pending": "未提供", "hint": "录入已收到的影像报告", "options": []}]}, "standing": {"title": "腹泻后起立时眼前发黑", "history": "虚构教学病例。主诉：站起后反复头昏、眼前发黑3天。现病史：近3天腹泻、进食饮水减少。从床边站起约十几秒，眼前逐渐发暗、两腿发软，觉得快要晕倒，坐下约半分钟好转。没有天旋地转，躺下或翻身不会诱发。没有完全丧失意识。平卧时测过血压，具体数值记不清；未测立位血压及心率，未提供心电图和完整服药史。", "lessons": [{"id": "L1", "title": "起立与坐下构成一条线索", "explanation": "起立后血液向下肢和腹腔静脉重新分布，回心血量暂时下降。循环代偿不足时可出现眼前发暗、腿软、将要晕倒，坐卧后好转。部分患者也会形容为旋转。", "case_link": "本例每次站起十几秒出现症状，坐下约半分钟好转，意识始终保留。", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "L2", "title": "腹泻为什么值得问", "explanation": "液体丢失增加，加上进食饮水减少，可能导致血容量不足，使站立时更难维持血压。问清腹泻、饮水和尿量，再查容量状态与近期用药，有助于判断原因。", "case_link": "这份病史提示可能有容量不足；没有体征或血压结果足以证实。", "evidence_ids": ["S2", "S3"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "L3", "title": "怎样取得可解释的血压记录", "explanation": "先平卧休息至少5分钟，测血压、心率。在保护下站立，于约1分钟和3分钟复测，并记录症状。经典型体位性低血压通常指站立3分钟内收缩压持续下降至少20 mmHg，或舒张压至少下降10 mmHg。", "case_link": "本例只测过平卧血压，数值也未提供，尚不能诊断体位性低血压。", "evidence_ids": ["S2", "S3"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "L4", "title": "发作很早时如何理解阴性结果", "explanation": "最初十几秒的短暂血压下降可能在袖带读出数值前恢复。若病史高度吻合而常规测量未捕捉到，可考虑有监护的主动站立及连续逐搏血压记录。", "case_link": "记录出现眼前发黑和开始缓解的具体时刻，才能与血压曲线对照。", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}], "questions": [{"id": "Q3", "priority": 1, "category": "基础", "question": "为什么腹泻会让人站起来更容易发晕？", "answer": "腹泻丢失液体，饮水少又可能补充不足。站立后回心血量进一步减少，脑灌注可能一过性下降。", "case_link": "容量不足是待验证的机制。", "pitfall": "", "evidence_ids": ["S2", "S3"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q5", "priority": 2, "category": "诊疗", "question": "卧立位血压和心率怎样测才有可比性？", "answer": "平卧至少5分钟测基线，在保护下站起，约1分钟和3分钟各测一次血压及心率，同时记录症状。", "case_link": "原病史缺立位测量，不能计算变化量。", "pitfall": "", "evidence_ids": ["S2", "S3"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q7", "priority": 3, "category": "拓展", "question": "如果第1分钟的读数正常，能解释起立十几秒就晕吗？", "answer": "可能错过了刚起立时的短暂下降。症状反复且时序吻合时，可考虑连续逐搏血压记录来捕捉早期变化。", "case_link": "本例发作早于常规第一次袖带测量。", "pitfall": "", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q1", "priority": 4, "category": "基础", "question": "用一句话描述这次发作，怎么说？", "answer": "起立后十几秒出现眼前发暗、腿软和近晕厥感，坐下约半分钟缓解，全程未丧失意识。", "case_link": "回答包括体位、潜伏时间、缓解方式和意识。", "pitfall": "", "evidence_ids": [], "evidence_quotes": [], "evidence_status": "病史解读"}, {"id": "Q2", "priority": 5, "category": "基础", "question": "近晕厥和晕厥在问病史时怎么区分？", "answer": "问有无短暂意识丧失、是否倒地，有目击者时再核实经过。本例描述为快要晕倒，意识仍在。", "case_link": "原文明确写了没有完全丧失意识。", "pitfall": "", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q4", "priority": 6, "category": "基础", "question": "“天旋地转”这四个字能区分耳石症和直立性头晕吗？", "answer": "不能只靠感觉定病因。更有用的是问站起是否诱发、坐卧是否缓解，以及躺下或床上翻身会不会同样诱发。", "case_link": "本例站起诱发，躺下或翻身不诱发。", "pitfall": "", "evidence_ids": ["S1"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q6", "priority": 7, "category": "基础", "question": "经典型体位性低血压用什么阈值判断？", "answer": "通常为站立3分钟内收缩压较平卧持续下降至少20 mmHg，或舒张压至少下降10 mmHg，满足其一即可。", "case_link": "本例没有可代入的实际读数。", "pitfall": "", "evidence_ids": ["S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q8", "priority": 8, "category": "诊疗", "question": "为找可逆原因，除了问腹泻还要查什么？", "answer": "问饮水、尿量、近期加用或加量的利尿剂和降压药，评估容量状态，按病情检查电解质和肾功能。", "case_link": "病史只提到摄入减少，未给完整服药史。", "pitfall": "", "evidence_ids": ["S3", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q9", "priority": 9, "category": "基础", "question": "为什么要把心率和血压一起记录？", "answer": "有血压下降时，明显增快的心率可提示容量不足等非神经源性原因。若增快不明显，先核对影响心率的药物和心律，再考虑自主神经功能障碍。", "case_link": "本例无立位心率记录。", "pitfall": "", "evidence_ids": ["S3"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q10", "priority": 10, "category": "诊疗", "question": "如果发作还伴心悸，下一步应补哪条线索？", "answer": "问清心悸与近晕厥的先后、是否在非直立时也发作，并检查脉搏和心电图；必要时进一步评估阵发性心律失常。", "case_link": "心电图未提供，原文也没有说明有无心悸。", "pitfall": "", "evidence_ids": ["S1", "S3"], "evidence_quotes": [], "evidence_status": "校订参考"}], "sources": [{"id": "S1", "title": "Bárány 学会血流动力性直立性头晕诊断标准", "year": "2019", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9249281/", "retrieved": "2026-11-13", "level": "editorial"}, {"id": "S2", "title": "美国高血压学会立场文件：体位性低血压的评估与治疗", "year": "2013", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3769179/", "retrieved": "2026-11-13", "level": "editorial"}, {"id": "S3", "title": "神经源性体位性低血压筛查与诊断专家共识", "year": "2017", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC5533816/", "retrieved": "2026-11-13", "level": "editorial"}], "provenance": {"original_model": "deepseek-flash", "original_prompt": "1.2", "editor": "Codex", "clinician_reviewed": false, "study_revision": "开场汇报与优先提问"}, "short": "起立后眼前发黑", "caption": "体位改变 · 坐下缓解", "fields": [{"id": "course", "group": "问诊", "label": "病程与背景", "val": "近3天腹泻、进食饮水减少", "core": true}, {"id": "trigger", "group": "问诊", "label": "触发与性质", "val": "站起十几秒后眼前发黑、腿软，有将要晕倒感", "core": true}, {"id": "relief", "group": "问诊", "label": "缓解与意识", "val": "坐下约半分钟缓解，未完全丧失意识", "core": true}, {"id": "negative", "group": "问诊", "label": "相关阴性", "val": "无旋转感，躺下或翻身不诱发", "core": true}, {"id": "sup", "group": "查体", "label": "卧位血压和心率", "pending": "数值未记录", "hint": "原例自述曾测卧位血压、数值记不清；补录须注明来源", "options": []}, {"id": "stand1", "group": "查体", "label": "立位第1分钟血压和心率", "pending": "未测", "hint": "填写该时点实际测量的血压和心率", "options": []}, {"id": "stand3", "group": "查体", "label": "立位第3分钟血压和心率", "pending": "未测", "hint": "与第1分钟分别记录", "options": []}, {"id": "symtime", "group": "问诊", "label": "测量时症状与出现时间", "pending": "未记录", "hint": "注明相对站起时间、是否有症状", "options": []}, {"id": "diarr", "group": "问诊", "label": "腹泻次数", "pending": "未记录", "hint": "记录频次和时间范围", "options": []}, {"id": "fluid", "group": "问诊", "label": "饮水量", "pending": "未记录", "hint": "注明估计量和时间范围", "options": []}, {"id": "urine", "group": "问诊", "label": "尿量变化", "pending": "未记录", "hint": "记录患者描述或实际测量值", "options": []}, {"id": "med", "group": "问诊", "label": "近期用药变化", "pending": "未提供", "hint": "注明变更药名与时间，或明确询问后的回答", "options": []}, {"id": "palp", "group": "问诊", "label": "心悸史", "pending": "未记录", "hint": "核对有无心悸及其时间关系", "options": []}, {"id": "syn", "group": "问诊", "label": "既往晕厥史", "pending": "未记录", "hint": "区分既往与本次发作", "options": []}, {"id": "pulse", "group": "查体", "label": "脉搏", "pending": "未记录", "hint": "注明实际查得的节律等", "options": []}, {"id": "ecg", "group": "辅助检查", "label": "心电图", "pending": "未提供", "hint": "录入已收到的检查结果", "options": []}]}, "auditory": {"title": "反复自发眩晕伴左耳闷鸣", "history": "虚构教学病例。主诉：反复眩晕伴左耳耳鸣1个月。现病史：一个月来有3次在静坐或行走中突然感觉周围旋转，每次持续约40至80分钟，与翻身、站起均无固定关系。每次发作左耳闷胀、低调耳鸣，自觉声音发闷，数小时后减轻，发作间可正常活动。未提供纯音测听、偏头痛病史及发作时神经查体。", "lessons": [{"id": "L1", "title": "发作时长和同侧耳症状为什么要一起问", "explanation": "自发旋转感持续数十分钟，每次伴同一侧耳鸣、耳闷或主观听力变化，应考虑梅尼埃病。记录发作次数、时长和耳侧，才能判断与诊断标准吻合到哪一步。", "case_link": "本例一个月内发作3次，每次40至80分钟，都伴左耳不适。", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "L2", "title": "什么才算有听力证据", "explanation": "患者说声音发闷，说明其感受到听觉变化。纯音测听比较气导与骨导听阈，可以判断是否为感音神经性听力损失以及涉及哪些频段。一次测听可以记录当时的听力，证明听阈随时间波动需要比较不同时点。", "case_link": "本例没有听力图，耳鸣音调也不能代替受损频段。", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "L3", "title": "还要想到前庭性偏头痛", "explanation": "两种疾病的发作时长可以重叠。追问以往有无偏头痛，并逐次问眩晕时有无偏头痛样头痛、同时畏光畏声或视觉先兆。核对总发作次数和伴随这些特征的比例。", "case_link": "原病史未提供偏头痛史；这一个月只明确记载了3次发作。", "evidence_ids": ["S3", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "L4", "title": "哪些线索会改变评估的紧迫性", "explanation": "反复发作和间期恢复不能单独排除后循环缺血。若发作时出现复视、言语不清、单侧无力或严重站立不稳，应尽快按疑似脑血管事件评估，不等常规测听。", "case_link": "本例未提供发作时神经查体，不能写作查体正常。", "evidence_ids": ["S4"], "evidence_quotes": [], "evidence_status": "校订参考"}], "questions": [{"id": "Q2", "priority": 1, "category": "基础", "question": "哪一组线索让你优先想到梅尼埃病？", "answer": "多次自发旋转性眩晕，持续数十分钟，且同侧耳鸣、耳闷随发作加重后减轻。单凭这组症状还不能确诊。", "case_link": "患者每次发作都有左耳症状。", "pitfall": "", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q4", "priority": 2, "category": "诊疗", "question": "下一项最能补齐诊断证据的检查是什么？", "answer": "做双耳纯音测听，比较气导和骨导，记录患耳有无低至中频感音神经性听力损失。", "case_link": "左耳声音发闷是主观症状，尚无测听结果。", "pitfall": "", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q9", "priority": 3, "category": "基础", "question": "为了鉴别前庭性偏头痛，最该追问什么？", "answer": "问偏头痛史及更早的眩晕发作，再问眩晕时有无偏头痛样头痛、畏光伴畏声或视觉先兆。明确诊断通常要求至少5次符合条件的发作，其中至少一半伴偏头痛特征。", "case_link": "现有文字只有3次，既往资料不全。", "pitfall": "", "evidence_ids": ["S3"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q1", "priority": 4, "category": "基础", "question": "先用一句话概括这例眩晕的模式。", "answer": "一个月内3次自发性眩晕，每次40至80分钟，均伴左耳闷鸣和主观声音发闷，发作间能正常活动。", "case_link": "概括时一并交代时长与耳侧。", "pitfall": "", "evidence_ids": [], "evidence_quotes": [], "evidence_status": "病史解读"}, {"id": "Q3", "priority": 5, "category": "基础", "question": "没有固定翻身或起立诱因，可以排除耳石症或直立性头晕吗？", "answer": "这段病史较少支持典型耳石症或直立诱发的头晕。仍要问其他发作是否由改变头位或站立触发，不能单凭这一条排除。", "case_link": "静坐或行走时均发生过自发发作。", "pitfall": "", "evidence_ids": [], "evidence_quotes": [], "evidence_status": "病史解读"}, {"id": "Q5", "priority": 6, "category": "基础", "question": "低调耳鸣就等于低频听力下降吗？", "answer": "不能这样推断。耳鸣音调描述患者听到的声音，听力损失的频段和性质要看听力图。", "case_link": "原文只提供了患者对声音的描述。", "pitfall": "", "evidence_ids": ["S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q6", "priority": 7, "category": "诊疗", "question": "一次听力图能说明什么，怎样看波动？", "answer": "一次检查可记录当时各频率的听阈；若记录到符合标准的损失，可作为诊断证据。比较发作期与间歇期的听力图才能客观描述听阈变化。", "case_link": "病史描述的是耳部症状波动。", "pitfall": "", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q7", "priority": 8, "category": "基础", "question": "按 Bárány 学会标准，明确梅尼埃病要满足什么？", "answer": "至少2次自发眩晕，每次20分钟至12小时；至少一次测听记录到患耳低至中频感音神经性听力损失；同侧耳部症状波动，且无更合适的其他诊断。", "case_link": "本例符合次数和时长，听力证据与鉴别评估仍缺。", "pitfall": "", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q8", "priority": 9, "category": "拓展", "question": "没有符合标准的听力图，什么情况下还可考虑可能梅尼埃病？", "answer": "至少2次眩晕或头晕，每次20分钟至24小时，伴患耳波动性耳部症状，且无其他疾病能更好解释。可结合后续测听重新判断。", "case_link": "已有症状线索，仍需评估其他病因。", "pitfall": "", "evidence_ids": ["S1", "S2"], "evidence_quotes": [], "evidence_status": "校订参考"}, {"id": "Q10", "priority": 10, "category": "诊疗", "question": "间歇期走路正常，还要追问哪些危险信号？", "answer": "追问发作时有无复视、构音障碍、单侧无力或严重站立困难。若有，应及时评估后循环缺血，即使到床旁时已经缓解。", "case_link": "发作间能活动，不能代替发作时的神经查体。", "pitfall": "", "evidence_ids": ["S4"], "evidence_quotes": [], "evidence_status": "校订参考"}], "sources": [{"id": "S1", "title": "Bárány 学会等联合制定的梅尼埃病诊断标准", "year": "2015", "url": "https://pubmed.ncbi.nlm.nih.gov/25882471/", "retrieved": "2026-11-13", "level": "editorial"}, {"id": "S2", "title": "AAO-HNSF 梅尼埃病临床实践指南", "year": "2020", "url": "https://doi.org/10.1177/0194599820909438", "retrieved": "2026-11-13", "level": "editorial"}, {"id": "S3", "title": "Bárány 学会与国际头痛学会前庭性偏头痛诊断标准更新", "year": "2022", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9249276/", "retrieved": "2026-11-13", "level": "editorial"}, {"id": "S4", "title": "Bárány 学会血管性眩晕诊断标准", "year": "2022", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9249306/", "retrieved": "2026-11-13", "level": "editorial"}], "provenance": {"original_model": "deepseek-flash", "original_prompt": "1.2", "editor": "Codex", "clinician_reviewed": false, "study_revision": "开场汇报与优先提问"}, "short": "自发眩晕伴左耳闷鸣", "caption": "反复发作 · 同侧耳症状", "fields": [{"id": "course", "group": "问诊", "label": "病程与次数", "val": "近1个月有3次自发旋转性眩晕", "core": true}, {"id": "duration", "group": "问诊", "label": "单次持续与诱因", "val": "每次约40至80分钟，与翻身、站起均无固定关系", "core": true}, {"id": "ear", "group": "问诊", "label": "伴随耳症状", "val": "发作均伴左耳闷胀、耳鸣和主观听声音发闷，数小时后减轻", "core": true}, {"id": "interval", "group": "问诊", "label": "发作间状态", "val": "发作间可正常活动", "core": true}, {"id": "audio", "group": "辅助检查", "label": "本次纯音测听", "pending": "未提供", "hint": "录入检查日期、耳侧、气骨导听阈或报告结论", "options": []}, {"id": "oldAudio", "group": "辅助检查", "label": "既往听力图", "pending": "未提供", "hint": "区分本次与既往检测", "options": []}, {"id": "migHistory", "group": "问诊", "label": "既往偏头痛史", "pending": "未提供", "hint": "记录患者对既往头痛史的回答", "options": []}, {"id": "mig", "group": "问诊", "label": "发作时偏头痛特征", "pending": "未记录", "hint": "记录头痛、畏光等与眩晕的时间关系", "options": []}, {"id": "neuro", "group": "问诊", "label": "发作时神经症状", "pending": "未记录", "hint": "记录已问症状、时间关系", "options": []}, {"id": "eyes", "group": "查体", "label": "发作时眼球运动", "pending": "未记录", "hint": "仅录入发作时的实际观察", "options": []}, {"id": "coord", "group": "查体", "label": "发作时肢体协调", "pending": "未记录", "hint": "注明是否在发作中检查", "options": []}, {"id": "gait", "group": "查体", "label": "发作时步态", "pending": "未记录", "hint": "注明实际观察情境", "options": []}]}};</script><script>'use strict';
const $=s=>document.querySelector(s), keys=Object.keys(DATA), groups=['问诊','查体','辅助检查'], STORE='neuro.teaching.rounds.v1.3';
const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vital=k=>['sup','stand1','stand3'].includes(k);
const states={record:'已记录',abnormal:'异常',negative:'明确阴性',unable:'无法评估',unknown:'已询问，情况不详'};
let book={},id='turning',view='intake',editing=null,origin=null,timer,memOnly=false;
try{book=JSON.parse(localStorage.getItem(STORE)||'{}')||{};}catch{memOnly=true;}
const cs=()=>DATA[id], list=()=>cs().fields, fBy=k=>list().find(f=>f.id===k);
function saveBook(){try{localStorage.setItem(STORE,JSON.stringify(book))}catch{memOnly=true}}
function current(f){return book[id]?.items?.[f.id] || (f.core?{s:'record',v:f.val}:{s:'pending',v:''})}
function pending(f){return !['record','abnormal','negative'].includes(current(f).s)}
function status(f){const d=current(f);return d.s==='pending'?(f.pending||(f.group==='问诊'?'未记录':'未查')):states[d.s]}
function val(f){const d=current(f);if(!vital(f.id)||!d.bp)return d.v||'';const b=d.bp;return [b[0]&&b[1]?b[0]+'/'+b[1]+' mmHg':'',b[2]?'心率 '+b[2]+' 次/分':''].filter(Boolean).join('，')}
function complete(f){return !pending(f)&&(!vital(f.id)||current(f).bp?.every(Boolean))}
function speak(){
 const base=list().filter(f=>f.core&&!pending(f)).map(f=>val(f));
 const extra=list().filter(f=>!f.core&&!pending(f)).map(f=>f.label+'：'+val(f));
 const unable=list().filter(f=>['unable','unknown'].includes(current(f).s)).map(f=>f.label+'：'+status(f)+(val(f)?'（'+val(f)+'）':''));
 return [(base.length?'患者'+base.join('；')+'。':''),extra.length?extra.join('；')+'。':'',unable.length?unable.join('；')+'。':''].filter(Boolean).join('\n')||'尚无可用于汇报的已记录事实。';
}
function toast(msg){$('#toast').textContent=msg;$('#toast').className='on';clearTimeout(timer);timer=setTimeout(()=>$('#toast').className='',2300)}
function caseNav(){$('#cases').innerHTML=keys.map((k,i)=>`<button class="casebtn" data-case="${k}" aria-pressed="${id===k}"><span class="num">0${i+1}</span><span><b>${h(DATA[k].short)}</b><small>${h(DATA[k].caption)}</small></span></button>`).join('')}
const fmt=s=>h(s).replace(/\n/g,'<br>');
const small=n=>String(n).padStart(2,'0');
function card(title,body,meta=''){return `<section class="card"><div class="spread cardhead"><h2>${title}</h2>${meta}</div>${body}</section>`}
function hdr(){const rev=book[id]?.rev||0;return `<div class="eyebrow">NEUROLOGY &nbsp;/&nbsp; CASE ${small(keys.indexOf(id)+1)}</div><div class="heading"><h1>${h(cs().short)}</h1><p>${h(cs().caption)}　·　${rev?'本例已修改 '+rev+' 次':'已载入原病例记录'}</p></div><nav class="stepbar" aria-label="病例流程"><button data-view="intake" class="${view==='intake'?'active':''}"><span class="stepno">01</span>问诊查体</button><button data-view="rounds" class="${view==='rounds'?'active':''}"><span class="stepno">02</span>查房准备</button></nav>`}
function row(f){const d=current(f);
 return `<div class="row" id="row-${f.id}"><div><div class="rowlabel">${h(f.label)} ${!f.core||d.s!=='record'?`<span class="tag ${pending(f)?'wait':'good'}">${h(status(f))}</span>`:''}</div>${val(f)?`<div class="rowtext">${h(val(f))}</div>`:''}</div><button class="editbtn" data-edit="${f.id}" aria-label="编辑：${h(f.label)}">${val(f)?'修改':'填写'}</button></div>`;}
function gapCard(){const missing=list().filter(f=>!complete(f));
 const gap=f=>`<button class="gap" data-edit="${f.id}" aria-label="补录：${h(f.label)}"><span>${h(f.label)}</span><small>${pending(f)?h(status(f)):'部分已录'} ›</small></button>`;
 return card('待补信息',`<p class="footnote">点一项即可回到对应的问诊或查体字段。</p>`+
 (missing.length?groups.map(g=>{const x=missing.filter(f=>f.group===g);return x.length?`<div class="group-title">${g}</div>${x.map(gap).join('')}`:''}).join(''):'<p class="empty">本例所列字段均已有记录。</p>'),`<span class="tag wait">${missing.length} 项</span>`);
}
function intake(){const rendered=groups.map(g=>{const x=list().filter(f=>f.group===g);return x.length?card(g==='问诊'?'问诊记录':g==='查体'?'床旁查体':'辅助检查',x.map(row).join(''),`<span class="tagnum">${small(x.length)}</span>`):''}).join('');
 return `<div class="layout"><div class="col">${rendered}</div><div class="col mobile-first"><section class="card hero"><div class="eyebrow">HANDOFF</div><h2>准备这次查房</h2><p class="small">使用左侧已核对的记录生成口头汇报。未查、未测和未记录均保留原状态。</p><button class="primary big" data-view="rounds">准备查房　→</button></section>${sourceCard()}${stateCard()}</div></div>`;}
function sourceCard(){return `<section class="card"><details><summary>查看虚构病例原文</summary><p class="rowtext">${h(cs().history)}</p></details></section>`}
function stateCard(){return `<section class="card"><div class="eyebrow">PRACTICE NOTES</div><p class="footnote">${memOnly?'当前浏览器只在本页保留演练记录。':'本例的修改保存在当前浏览器；四例互相独立。'}仅供虚构病例演练。</p><button class="textbtn reset" data-reset>恢复本例初始记录</button></section>`}
function ref(ids){const ss=cs().sources.filter(s=>ids?.includes(s.id));return ss.length?`<div class="footnote">依据：${ss.map(s=>`<a href="${h(s.url)}" target="_blank" rel="noreferrer">${h(s.title)}${s.year?' · '+h(s.year):''}</a>`).join('；')}</div>`:'';}
function rounds(){const c=cs(),s=speak();const changed=book[id]?.rev||0;
 const facts=`<section class="card hero"><div class="spread"><div class="eyebrow">01 / ORAL REPORT</div><span class="tag good">${changed?'已按当前记录更新':'基于本例记录'}</span></div><h2>查房口头汇报</h2><p class="oral" id="oral">${fmt(s)}</p><div class="actions"><button class="secondary" data-copy>复制汇报</button><button class="textbtn" data-view="intake">核对或修改记录</button></div></section>`;
 const l=c.lessons.map(a=>`<div class="lesson"><h4>${h(a.title)}</h4><p>${h(a.explanation)}</p>${ref(a.evidence_ids)}</div>`);
 const lesson=card('简短知识讲解',`<p class="footnote">以下讲解和参考答案针对原虚构病例，未经临床医师审阅。</p>${l[0]}<details class="blockmore"><summary>其余 ${l.length-1} 个知识点</summary>${l.slice(1).join('')}</details>`,'<span class="tagnum">02</span>');
 const qs=c.questions.map((q,i)=>`<details class="question" data-q="${h(q.id)}"><summary><span class="qno">${small(i+1)} / </span>${h(q.question)}</summary><div class="answer"><b>原例参考回答：</b>${h(q.answer)}</div>${ref(q.evidence_ids)}</details>`);
 const practice=card('优先练这三题',`<p class="footnote">试着先开口，再点题干揭晓原例答案。</p>${qs.slice(0,3).join('')}<details data-extra class="blockmore"><summary>展开其余 ${qs.length-3} 题</summary>${qs.slice(3).join('')}</details>`,'<span class="tagnum">03</span>');
 const ab=list().filter(f=>f.group==='查体'&&current(f).s==='abnormal');
 return `<div class="layout"><div class="col">${facts}${lesson}${practice}</div><div class="col">${gapCard()}${card('已标记的异常体征',ab.length?ab.map(row).join(''):'<p class="empty">暂无已标记的异常体征。未查项目不计入。</p>')}${sourceCard()}${stateCard()}</div></div>`;}
const expanded={};
function render(resetScroll=false){caseNav();$('#main').innerHTML=hdr()+(view==='intake'?intake():rounds());if(view==='rounds')for(const el of $('#main').querySelectorAll('[data-q],[data-extra]'))el.open=!!expanded[id+':'+(el.dataset.q||'rest')];if(resetScroll)window.scrollTo(0,0)}
function screen(v){view=v;render(true)}
function openEditor(k){
 const f=fBy(k),d=current(f);origin=view;editing=k;if(view==='rounds'){view='intake';render();}$('#row-'+k)?.scrollIntoView({block:'center'});
 const dlg=$('#edit'),vitals=vital(k),a=f.group==='问诊';
 const choices=[['pending',f.pending||'未记录'],['record',vitals?'已测量':'已记录'],...(vitals?[]:f.group==='查体'?[['abnormal','标记异常'],['negative','明确阴性']]:[]),[a?'unknown':'unable',a?'已询问，情况不详':'无法评估']];
 dlg.innerHTML=`<form id="entry"><div class="spread dhead"><div><div class="eyebrow">补录 / ${h(f.group)}</div><h2>${h(f.label)}</h2></div><button type="button" class="close" data-dismiss aria-label="关闭">×</button></div><p class="footnote">${h(f.hint||'按实际核对的信息填写，撤回记录可选「未记录」。')}</p><label class="lab">记录状态<select class="control" id="st">${choices.map(([key,name])=>`<option value="${key}" ${key===d.s?'selected':''}>${name}</option>`).join('')}</select></label>
 ${vitals?`<div id="bpWrap" class="vgrid">${['收缩压','舒张压','心率'].map((v,i)=>`<label class="lab">${v}<input class="control" id="bp${i}" inputmode="numeric" maxlength="3" placeholder="${i===2?'次/分':'mmHg'}" value="${h(d.bp?.[i]||'')}"></label>`).join('')}</div>`:''}
 <div id="txtWrap"><label class="lab" for="txt">具体记录</label><textarea class="control" id="txt" maxlength="500" placeholder="仅填写实际获得的信息">${h(d.v||'')}</textarea></div>
 ${(f.options||[]).map(opt=>`<button type="button" class="preset" data-preset="${h(opt)}">示例：${h(opt)}</button>`).join('')}
 <p class="footnote">输入内容会自动切到已记录；选择未记录可撤回结果。</p><div class="err" id="error" role="alert"></div><div class="actions"><button type="submit" class="primary">${origin==='rounds'?'保存并返回汇报':'保存记录'}</button><button type="button" data-dismiss class="secondary">取消</button></div></form>`;
 dlg.showModal();if(vitals)$('#bp0').focus();else $('#txt').focus();adjust(false);
}
function adjust(fromStatus){
 const f=fBy(editing),s=$('#st').value,bp=vital(f.id),exc=['unable','unknown'].includes(s);
 if(bp){$('#bpWrap').classList.toggle('hide',exc);$('#txtWrap').classList.toggle('hide',!exc)}
 if(fromStatus&&s==='pending'){ $('#txt').value='';if(bp)for(let i=0;i<3;i++)$('#bp'+i).value=''; }
 if(fromStatus&&exc){$('#txt').value='';}
}
function closeEditor(saved=false){
 const g=editing,v=origin;$('#edit').close();editing=origin=null;view=v;render();if(v==='intake')$('#row-'+g+' button')?.focus({preventScroll:true});else{window.scrollTo(0,0);if(!saved)document.querySelector('.gap[data-edit="'+g+'"]')?.focus({preventScroll:true});}
}
function commit(e){e.preventDefault();const f=fBy(editing),s=$('#st').value,desc=$('#txt').value.trim(),res={s,v:''};let msg='';
 if(s!=='pending'){
  if(vital(f.id)&&s==='record'){res.bp=[0,1,2].map(i=>$('#bp'+i).value.trim());const [hi,lo,hr]=res.bp;
   if(!hi&&!lo&&!hr)msg='请填写血压或心率；没有测量可保留原状态。';
   else if(!!hi!==!!lo)msg='血压需成对填写收缩压和舒张压。';
   else if(res.bp.some(v=>v&&!/^[1-9]\d{0,2}$/.test(v)))msg='测量数值请填写 1 至 3 位正整数。';
   else if(hi&&lo&&Number(hi)<=Number(lo))msg='请核对收缩压与舒张压的顺序。';
  }else{res.v=desc;if(!desc&&!['unable','unknown'].includes(s))msg='请填写实际所见或所问内容，再保存记录。';}
 }
 if(msg){$('#error').textContent=msg;return;}
 const st=book[id]||={items:{},rev:0};st.items[f.id]=res;st.rev++;saveBook();closeEditor(true);toast(view==='rounds'?'已保存，口头汇报已更新':'记录已保存');
}
let resetFor=null;
function reset(){resetFor=id;$('#edit').innerHTML='<form><div class="dhead"><h2>恢复本例初始记录？</h2></div><p class="small">仅撤销这个虚构病例的演练修改。其他病例保持不变。</p><div class="actions"><button type="button" class="primary" data-confirm-reset>恢复本例</button><button type="button" class="secondary" data-dismiss>取消</button></div></form>';$('#edit').showModal()}
function dismiss(){if(editing)closeEditor();else{$('#edit').close();resetFor=null}}
$('#edit').addEventListener('cancel',e=>{e.preventDefault();dismiss()});
document.addEventListener('submit',e=>{if(e.target.id==='entry')commit(e)});
document.addEventListener('change',e=>{if(e.target.id==='st')adjust(true)});
document.addEventListener('input',e=>{if(editing&&(e.target.id==='txt'||/^bp\d$/.test(e.target.id))&&$('#st').value==='pending'&&e.target.value.trim())$('#st').value='record';});
document.addEventListener('toggle',e=>{const el=e.target;if(el.matches?.('[data-q],[data-extra]')&&el.isConnected)expanded[id+':'+(el.dataset.q||'rest')]=el.open;},true);
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.case){id=b.dataset.case;screen('intake')}
 else if(b.dataset.view){screen(b.dataset.view)}
 else if(b.dataset.edit){openEditor(b.dataset.edit)}
 else if(b.hasAttribute('data-dismiss'))dismiss();
 else if(b.hasAttribute('data-preset')){$('#st').value='negative';$('#txt').value=b.dataset.preset;$('#txt').focus()}
 else if(b.hasAttribute('data-copy')){try{await navigator.clipboard.writeText(speak());toast('汇报已复制')}catch{const range=document.createRange();range.selectNodeContents($('#oral'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);toast('已选中汇报，请按 Ctrl+C 复制')}}
 else if(b.hasAttribute('data-reset'))reset();
 else if(b.hasAttribute('data-confirm-reset')&&resetFor===id){delete book[id];saveBook();dismiss();render(true);toast('已恢复本例初始记录')}
});
render();
</script></body></html>
